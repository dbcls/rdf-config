title: MarpolBase RDF
website: https://marchantia.info/
description: >-
  Integrated RDF of Marchantia polymorpha from MarpolBase — genes with functional
  annotation (GO, Pfam, KOG, KEGG, orthogroups), gene-literature assertions,
  RNA-seq conditions with a controlled vocabulary mapped to PECO/PO, condition-enriched
  genes, a co-expression network, and the structural annotation of the MpTak_v7.1
  standard genome (transcripts, exons, CDS with phase, UTRs, proteins) with FALDO
  coordinates and Sequence Ontology feature types. Proteins carry sequence-based
  cross-references to UniProt.
tags: [ Gene, Genome, Gene expression, Sequence, Journal article/Report/Bibliography ]
provider: National Institute of Genetics
