title: MarpolBase RDF
website: https://marchantia.info/
description: >-
  ゼニゴケ (Marchantia polymorpha) の統合 RDF。遺伝子の機能アノテーション
  （GO・Pfam・KOG・KEGG・オルソログ群）、遺伝子と文献の対応（実験的証拠か配列類似か、
  および論文中での遺伝子の役割つき）、PECO / PO に対応づけた統制語彙を持つ RNA-seq の
  実験条件、条件ごとの高発現遺伝子、共発現ネットワーク、および MpTak_v7.1 標準ゲノムの
  構造アノテーション（転写産物・エクソン・phase つき CDS・UTR・タンパク質）を
  FALDO の座標と Sequence Ontology の feature type で表現している。
  タンパク質には配列比較にもとづく UniProt への参照を付けてある。
tags: [ Gene, Genome, Gene expression, Sequence, Journal article/Report/Bibliography ]
provider: 国立遺伝学研究所
creators:
