# ChEBI 2.0; examples checked against release 257.
- ChebiMolecule obo:CHEBI_27732:
  - a: owl:Class
  # Root classes and obsolete entries need not have a superclass.
  - rdfs:subClassOf*:
    - subclassof: ChebiMolecule
    - restriction: ChebiRestriction
  # Obsolete entries may contain only a type, obsolescence reason and replacement.
  - rdfs:label?:
    - label: "caffeine"
  - oboinowl:hasOBONamespace?:
    - has_obo_namespace: "chebi_ontology"
  - oboinowl:hasAlternativeId*:
    - has_alternative_id: "CHEBI:22982"
  - oboinowl:hasDbXref*:
    - molecule_has_db_xref: "kegg.compound:C07481"
  - oboinowl:hasExactSynonym*:
    - has_exact_synonym: "1,3,7-trimethyl-3,7-dihydro-1H-purine-2,6-dione"
  - oboinowl:hasRelatedSynonym*:
    - has_related_synonym: "Caffeine"
  - oboinowl:id?:
    - id: "CHEBI:27732"
  - oboinowl:inSubset?:
    - in_subset: AnnotationPropertyData
  - owl:deprecated?:
    - deprecated: '"true"^^xsd:boolean'
  - obo:IAO_0000115?:
    - definition: "A trimethylxanthine in which the three methyl groups are located at positions 1, 3, and 7. A purine alkaloid that occurs naturally in tea and coffee."
  - obo:IAO_0000231?:
    - has_obsolescence_reason: obo:IAO_0000227
  - obo:IAO_0100001?:
    # Example replacement for obsolete CHEBI:22584; keep source and target variables separate.
    - term_replaced_by: obo:CHEBI_2762
  - chemrof:charge?:
    - charge: '"0"^^xsd:integer'
  - chemrof:generalized_empirical_formula*:
    - formula: "C8H10N4O2"
  - chemrof:inchi_string?:
    - inchi: "InChI=1S/C8H10N4O2/c1-10-4-9-6-5(10)7(13)12(3)8(14)11(6)2/h4H,1-3H3"
  - chemrof:inchi_key_string?:
    - inchikey: "RYYVLZVUVIJVGH-UHFFFAOYSA-N"
  - chemrof:mass*:
    - mass: '"194.194"^^xsd:decimal'
  - chemrof:monoisotopic_mass*:
    - monoisotopicmass: '"194.08038"^^xsd:decimal'
  - chemrof:smiles_string?:
    - smiles: "Cn1c(=O)c2c(ncn2C)n(C)c1=O"
  - chemrof:wurcs_representation?:
    # Example from CHEBI:37671 (not caffeine).
    - wurcs: "WURCS=2.0/1,1,0/[a2122h-1b_1-5]/1/"

- ChebiRestriction:
  - a: owl:Restriction
  - owl:onProperty:
    - on_property: ObjectProperty
  - owl:someValuesFrom:
    # Use an IRI example to avoid reusing the source class's label/id variables.
    - some_values_from: obo:CHEBI_35610

- AnnotationPropertyData obochebi:3_STAR:
  - a: owl:AnnotationProperty
  - rdfs:label?:
    - annotation_property_label: "subset_property"
  - rdfs:subPropertyOf?:
    - annotation_propertyof: AnnotationPropertyData
  - rdfs:comment?:
    - annotation_property_comment: "Manually annotated by ChEBI Team"

- ObjectProperty obo:RO_0018038:
  - a: owl:ObjectProperty
  # Do not require owl:TransitiveProperty: most relations are not transitive.
  - owl:inverseOf?:
    - object_property_inverse_of: ObjectProperty
  - rdfs:label:
    - object_property_label: "has functional parent"
  - oboinowl:hasOBONamespace:
    - object_property_has_obo_namespace: "chebi_ontology"
  - oboinowl:hasDbXref*:
    - object_property_has_db_xref: "RO:0000087"
  - oboinowl:id:
    - object_property_id: "has_functional_parent"
  - oboinowl:is_cyclic:
    - object_property_is_cyclic: '"false"^^xsd:boolean'
  - oboinowl:is_transitive?:
    - object_property_is_transitive: '"false"^^xsd:boolean'

- ChebiOwl <http://purl.obolibrary.org/obo/chebi.owl>:
  - a: owl:Ontology
  - oboinowl:date:
    - chebi_owl_date: "05:11:2026 18:04"
  - oboinowl:default-namespace:
    - chebi_owl_default_namespace: "chebi_ontology"
  - oboinowl:hasOBOFormatVersion:
    - has_obo_format_version: "1.2"
  - oboinowl:saved-by:
    - chebi_owl_saved_by: "chebi"
  - owl:versionIRI:
    - chebi_owl_version_iri: <http://purl.obolibrary.org/obo/chebi/257/chebi.owl>
  - rdfs:comment:
    - chebi_owl_comment: "ChEBI subsumes and replaces the Chemical Ontology first. This ontology was developed by Michael Ashburner and Pankaj Jaiswal. Data was cuarated by The ChEBI Curation Team. For any queries contact chebi-help@ebi.ac.uk"
  - owl:versionInfo?:
    - chebi_owl_version: "257"
  - dcterms:title?:
    - chebi_owl_title: "ChEBI Ontology"
  - dcterms:description?:
    - chebi_owl_description: "Chemical Entities of Biological Interest, also known as ChEBI, is a chemical database and ontology of molecular entities focused on 'small' chemical compounds, that is part of the Open Biomedical Ontologies (OBO) effort at the European Bioinformatics Institute (EBI)."
  - dcterms:license?:
    - chebi_owl_license: <https://creativecommons.org/licenses/by/4.0/>
  - foaf:homepage?:
    - chebi_owl_homepage: '"https://www.ebi.ac.uk/chebi"^^xsd:anyURI'

- TransitiveProperty obo:RO_0018036:
  # These resources also have type owl:ObjectProperty. A type list would
  # generate an OR condition and incorrectly include non-transitive properties.
  - a: owl:TransitiveProperty
  - rdfs:label:
    - transitive_property_label: "is tautomer of"
  - oboinowl:hasOBONamespace:
    - transitive_property_has_obo_namespace: "chebi_ontology"
  - oboinowl:hasDbXref*:
    - transitive_property_has_db_xref: "BFO:0000051"
  - oboinowl:id:
    - transitive_property_id: "is_tautomer_of"
  - oboinowl:is_cyclic:
    - transitive_property_is_cyclic: '"true"^^xsd:boolean'
